services:
  - type: web
    name: hr-migration-agent
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
    healthCheckPath: /api/log
