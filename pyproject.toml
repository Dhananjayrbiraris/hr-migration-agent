[project]
name = "hr-migration-agent"
version = "0.1.0"
description = "Client data migration & integration agent (HR/CRM -> target platform) with human-in-the-loop review."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pandas==2.2.2",
    "python-dateutil==2.9.0.post0",
    "rapidfuzz==3.9.6",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]

[tool.uv]
package = false
